<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk Sherlock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    padding: 10px 0; 
    background: #e9e9e9; 
    font-family: Arial, sans-serif; 
    color: #111; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 20px; 
  }
  
  .region-selector-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #111;
    color: #fff;
    width: 100%;
    max-width: 210mm;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  
  .controls-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .region-selector-bar label { font-size: 13px; font-weight: bold; }
  
  .region-selector-bar select {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #ffc400;
    color: #111;
    cursor: pointer;
  }

  .btn-pdf {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #00a651;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }

  .btn-pdf:hover { background: #008540; }

  #catalog-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .page { 
    width: 210mm; 
    min-height: 290mm;
    height: auto; 
    background: #fff; 
    padding: 8mm 8mm 6mm 8mm; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
    box-sizing: border-box;
  }

  .header { 
    padding-bottom: 6px; 
    border-bottom: 2px solid #111; 
    margin-bottom: 8px; 
  }
  .header h1 { 
    margin: 0; 
    font-size: 22px; 
    font-weight: 800; 
    text-transform: uppercase; 
    letter-spacing: 0.5px;
  }
  .header .subtitle { 
    margin-top: 3px; 
    font-size: 11px; 
    font-style: italic; 
    font-weight: bold; 
    color: #333; 
  }
  
  .content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-around; 
    gap: 6px; 
  }

  .section { 
    display: grid; 
    grid-template-columns: 48px 1fr; 
    gap: 8px; 
  }
  
  .side-label { 
    display: flex; 
    flex-direction: column; 
  }

  .side-label .tag { 
    background: #ffc400 !important; 
    color: #111 !important;
    min-height: 38px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-size: 8.5px; 
    font-weight: 800; 
    text-align: center; 
    padding: 2px; 
    text-transform: uppercase; 
    border-radius: 2px 2px 0 0;
  }

  .side-label .vertical { 
    flex: 1; 
    background: #fff3cc !important; 
    color: #111 !important;
    writing-mode: vertical-rl; 
    text-orientation: mixed;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 11px; 
    font-weight: 800; 
    letter-spacing: 1px; 
    text-align: center; 
    text-transform: uppercase; 
    padding: 6px 0;
    border-radius: 0 0 2px 2px;
  }
  
  .product-panel { 
    display: grid; 
    grid-template-columns: 170px 1fr; 
    grid-template-rows: auto 1fr; 
    gap: 8px; 
  }
  
  .card-brand { 
    padding: 4px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    font-size: 14px; 
    font-weight: 800; 
    background: #ffffff !important;
    border-radius: 4px;
  }
  .card-brand img { 
    max-width: 100%; 
    max-height: 45px; 
    object-fit: contain; 
    cursor: pointer;
    background: #ffffff !important;
  }
  .card-brand small { 
    display: block; 
    font-size: 7.5px; 
    font-weight: 700; 
    margin-top: 1px; 
  }
  
  .card-title { 
    padding: 2px 0; 
    display: flex; 
    align-items: center; 
  }
  .card-title h2 { 
    margin: 0; 
    font-size: 17px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  
  .card-photo { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 155px; 
    padding: 4px; 
    background: #fafafa; 
  }
  .card-photo img { 
    max-width: 100%; 
    max-height: 150px; 
    object-fit: contain; 
    cursor: pointer;
  }
  
  .card-table-container { 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    position: relative; 
  }
  .unit-tag { 
    align-self: flex-end; 
    padding: 1px 4px; 
    font-size: 8.5px; 
    font-weight: 800; 
    background: #fff; 
    margin-bottom: 3px; 
  }
  
  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    font-size: 9.5px; 
  }
  th, td { 
    border: 1px solid #111; 
    padding: 5px 4px; 
    text-align: center; 
    vertical-align: middle; 
  }
  th { 
    background: #a6a6a6 !important; 
    color: #000 !important; 
    font-weight: 800; 
  }
  th.price-head { 
    background: #2522db !important; 
    color: #fff !important; 
  }
  th.online-head { 
    background: #00a651 !important; 
    color: #fff !important; 
  }
  td { font-weight: 700; }
  td.price-cell { 
    color: #2522db !important; 
    text-align: right; 
  }
  td.online-cell { 
    color: #00a651 !important; 
    text-align: right; 
  }
  
  .footer { 
    height: 40px; 
    background: #ffc400 !important; 
    margin-top: 4px; 
    display: grid; 
    grid-template-columns: 40px 1fr 140px; 
    align-items: center; 
    padding: 0 10px; 
    font-size: 9px; 
    font-weight: 700; 
  }
  .page-number { font-size: 24px; }
  .phone { text-align: center; line-height: 1.2; }
  .fax { text-align: right; }

  .image-modal {
    display: none; 
    position: fixed; 
    z-index: 9999; 
    left: 0; top: 0;
    width: 100%; height: 100%; 
    background-color: rgba(0, 0, 0, 0.85); 
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .image-modal-content {
    max-width: 90
