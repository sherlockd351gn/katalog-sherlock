<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Digital Sherlock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 0;
    color: #333;
  }
  .navbar {
    background: #111;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .brand {
    font-size: 18px;
    font-weight: bold;
    color: #ffc400;
  }
  .nav-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  select {
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    font-weight: bold;
  }
  .btn-nav {
    padding: 7px 12px;
    font-size: 13px;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-blue { background: #007bff; color: #fff; }
  .btn-blue:hover { background: #0056b3; }
  .btn-green { background: #00a651; color: #fff; }
  .btn-green:hover { background: #008540; }
  .btn-red { background: #dc3545; color: #fff; }
  .btn-red:hover { background: #bd2130; }

  .content-container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 15px;
  }
  .catalog-card {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">Sherlock Catalog</div>
  
  <div class="nav-controls">
    <label style="font-size: 12px; color: #aaa;">Wilayah:</label>
    <select id="regionSelect" onchange="handleRegionChange()">
      <option value="Jabodetabek">Jabodetabek</option>
      <option value="Jawa">Jawa</option>
      <option value="Sumatra">Sumatra</option>
      <option value="Luar Jawa">Luar Jawa</option>
    </select>

    <a id="btnPrintPDF" href="pdf.html" target="_blank" class="btn-nav btn-green">📄 Lihat Tampilan Cetak</a>
    <button id="btnShareToko" class="btn-nav btn-blue" onclick="handleShareToToko()" style="display:none;">🔗 Bagikan ke Toko</button>
    <button id="btnLogout" class="btn-nav btn-red" onclick="handleLogout()" style="display:none;">🚪 Logout</button>
  </div>
</div>

<div class="content-container">
  <div class="catalog-card">
    <h2 id="welcomeMsg">Memuat Katalog Produk...</h2>
    <p id="subMsg">Silakan tunggu sejenak.</p>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://yarudntqrnwljykieugl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcnVkbnRxcm53bGp5a2lldWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTc1NTIsImV4cCI6MjEwNzE3MzU1Mn0.cdJbmQhc_xqCJPOjJcDRJapgG9bIXjj0XbrB6RpYXKI';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  function checkAccess() {
    const urlParams = new URLSearchParams(window.location.search);
    const isGuestAccess = urlParams.get('access') === 'guest';
    const regionParam = urlParams.get('region');

    if (regionParam) {
      document.getElementById('regionSelect').value = regionParam;
    }

    if (isGuestAccess) {
      const salesName = urlParams.get('sales') || 'Official';
      document.getElementById('welcomeMsg').innerText = `Katalog Digital Sherlock (${document.getElementById('regionSelect').value})`;
      document.getElementById('subMsg').innerText = `Direkomendasikan oleh Sales: ${salesName}`;
      updatePrintPdfLink();
      return; 
    }

    const savedUser = localStorage.getItem('sherlock_user');
    if (!savedUser) {
      window.location.href = 'login.html';
      return;
    }

    currentUser = JSON.parse(savedUser);
    
    document.getElementById('btnShareToko').style.display = 'inline-flex';
    document.getElementById('btnLogout').style.display = 'inline-flex';

    if (currentUser.role === 'sales' && currentUser.region && currentUser.region !== 'All') {
      if (!regionParam) {
        document.getElementById('regionSelect').value = currentUser.region;
      }
    }

    document.getElementById('welcomeMsg').innerText = `Selamat Datang, ${currentUser.name}!`;
    document.getElementById('subMsg').innerText = `Katalog Wilayah: ${document.getElementById('regionSelect').value}`;
    updatePrintPdfLink();
  }

  function handleRegionChange() {
    const selectedRegion = document.getElementById('regionSelect').value;
    updatePrintPdfLink();
    if (currentUser) {
      document.getElementById('subMsg').innerText = `Katalog Wilayah: ${selectedRegion}`;
    }
  }

  function updatePrintPdfLink() {
    const currentRegion = document.getElementById('regionSelect').value;
    document.getElementById('btnPrintPDF').href = `pdf.html?region=${encodeURIComponent(currentRegion)}`;
  }

  function handleShareToToko() {
    const currentRegion = document.getElementById('regionSelect').value;
    const salesName = currentUser ? currentUser.name : 'Sales';
    const shareUrl = `${window.location.origin}/index.html?access=guest&sales=${encodeURIComponent(salesName)}&region=${encodeURIComponent(currentRegion)}`;

    navigator.clipboard.writeText(shareUrl);
    alert(`Link Katalog berhasil disalin!\n\nSales: ${salesName}\nWilayah: ${currentRegion}\n\nURL: ${shareUrl}\n\nSilakan kirimkan link ini ke WhatsApp Toko!`);
  }

  function handleLogout() {
    localStorage.removeItem('sherlock_user');
    window.location.href = 'login.html';
  }

  checkAccess();
</script>
</body>
</html>
