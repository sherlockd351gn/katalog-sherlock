<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk Sherlock</title>

<!-- Supabase JS Client & html2pdf Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    padding: 10px 0; 
    background: #e9e9e9; 
    font-family: Arial, sans-serif; 
    color: #111; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 20px; 
  }
  
  .region-selector-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #111;
    color: #fff;
    width: 100%;
    max-width: 210mm;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  
  .controls-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .region-selector-bar label { font-size: 13px; font-weight: bold; }
  
  .region-selector-bar select {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #ffc400;
    color: #111;
    cursor: pointer;
  }

  .btn-pdf {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #00a651;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }

  .btn-pdf:hover { background: #008540; }

  #catalog-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .page { 
    width: 210mm; 
    height: 290mm; 
    background: #fff; 
    padding: 8mm 8mm 6mm 8mm; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
    box-sizing: border-box;
  }
  
  .html2pdf__page-break {
    height: 0;
    page-break-before: always;
  }

  .header { 
    padding-bottom: 6px; 
    border-bottom: 2px solid #111; 
    margin-bottom: 8px; 
  }
  .header h1 { 
    margin: 0; 
    font-size: 22px; 
    font-weight: 800; 
    text-transform: uppercase; 
    letter-spacing: 0.5px;
  }
  .header .subtitle { 
    margin-top: 3px; 
    font-size: 11px; 
    font-style: italic; 
    font-weight: bold; 
    color: #333; 
  }
  
  .content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-around; 
    gap: 6px; 
  }

  .section { 
    display: grid; 
    grid-template-columns: 48px 1fr; 
    gap: 8px; 
  }
  
  .side-label { 
    display: flex; 
    flex-direction: column; 
  }

  .side-label .tag { 
    background: #ffc400 !important; 
    color: #111 !important;
    min-height: 38px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-size: 8.5px; 
    font-weight: 800; 
    text-align: center; 
    padding: 2px; 
    text-transform: uppercase; 
    border-radius: 2px 2px 0 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .side-label .vertical { 
    flex: 1; 
    background: #fff3cc !important; 
    color: #111 !important;
    writing-mode: vertical-rl; 
    text-orientation: mixed;
    transform: none;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 11px; 
    font-weight: 800; 
    letter-spacing: 1px; 
    text-align: center; 
    text-transform: uppercase; 
    padding: 6px 0;
    border-radius: 0 0 2px 2px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  
  .product-panel { 
    display: grid; 
    grid-template-columns: 170px 1fr; 
    grid-template-rows: auto 1fr; 
    gap: 8px; 
  }
  
  .card-brand { 
    padding: 4px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    font-size: 14px; 
    font-weight: 800; 
  }
  .card-brand img { 
    max-width: 100%; 
    max-height: 45px; 
    object-fit: contain; 
    cursor: pointer;
  }
  .card-brand small { 
    display: block; 
    font-size: 7.5px; 
    font-weight: 700; 
    margin-top: 1px; 
  }
  
  .card-title { 
    padding: 2px 0; 
    display: flex; 
    align-items: center; 
  }
  .card-title h2 { 
    margin: 0; 
    font-size: 17px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  
  .card-photo { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 155px; 
    padding: 4px; 
    background: #fafafa; 
  }
  .card-photo img { 
    max-width: 100%; 
    max-height: 150px; 
    object-fit: contain; 
    cursor: pointer;
  }
  
  .card-table-container { 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    position: relative; 
  }
  .unit-tag { 
    align-self: flex-end; 
    padding: 1px 4px; 
    font-size: 8.5px; 
    font-weight: 800; 
    background: #fff; 
    margin-bottom: 3px; 
  }
  
  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    font-size: 9.5px; 
  }
  th, td { 
    border: 1px solid #111; 
    padding: 5px 4px; 
    text-align: center; 
    vertical-align: middle; 
  }
  th { 
    background: #a6a6a6 !important; 
    color: #000 !important; 
    font-weight: 800; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  th.price-head { 
    background: #2522db !important; 
    color: #fff !important; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  th.online-head { 
    background: #00a651 !important; 
    color: #fff !important; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  td { font-weight: 700; }
  td.price-cell { 
    color: #2522db !important; 
    text-align: right; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  td.online-cell { 
    color: #00a651 !important; 
    text-align: right; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  
  .footer { 
    height: 40px; 
    background: #ffc400 !important; 
    margin-top: 4px; 
    display: grid; 
    grid-template-columns: 40px 1fr 140px; 
    align-items: center; 
    padding: 0 10px; 
    font-size: 9px; 
    font-weight: 700; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page-number { font-size: 24px; }
  .phone { text-align: center; line-height: 1.2; }
  .fax { text-align: right; }

  .image-modal {
    display: none; 
    position: fixed; 
    z-index: 9999; 
    left: 0; top: 0;
    width: 100%; height: 100%; 
    background-color: rgba(0, 0, 0, 0.85); 
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .image-modal-content {
    max-width: 90%; max-height: 85vh;
    object-fit: contain; border-radius: 6px;
    background: #fff; padding: 10px;
  }
  .close-modal {
    position: absolute; top: 15px; right: 25px;
    color: #fff; font-size: 35px; font-weight: bold; cursor: pointer;
  }

  @media (max-width: 600px) {
    body { padding: 0; }
    .region-selector-bar { max-width: 100%; flex-direction: column; gap: 8px; align-items: stretch; }
    .controls-group { justify-content: space-between; }
    .page { width: 100vw; height: auto; min-height: 100vh; padding: 10px; box-shadow: none; }
    .product-panel { grid-template-columns: 110px 1fr; gap: 4px; }
    .card-photo { min-height: 120px; }
    .card-photo img { max-height: 115px; }
    .card-title h2 { font-size: 13px; }
    table { font-size: 8px; }
    th, td { padding: 3px 1px; }
  }
</style>
</head>
<body>

<div class="region-selector-bar">
  <div class="controls-group">
    <label for="regionSelect">📍 Wilayah Harga:</label>
    <select id="regionSelect" onchange="updateWilayah(this.value)">
      <option value="Jabodetabek">Jabodetabek</option>
      <option value="Jawa" selected>Jawa</option>
      <option value="Sumatra">Sumatra</option>
      <option value="Luar Jawa">Luar Jawa</option>
    </select>
  </div>
  <button class="btn-pdf" onclick="generatePDF()">📄 Download PDF</button>
</div>

<div id="catalog-container">Memuat data dari Supabase...</div>

<div id="imageModal" class="image-modal" onclick="closeZoom()">
  <span class="close-modal" onclick="closeZoom()">&times;</span>
  <img class="image-modal-content" id="modalImg" alt="Zoom Foto">
</div>

<script>
  const SUPABASE_URL = 'https://yarudntqrnwljykieugl.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcnVkbnRxcm53bGp5a2lldWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTc1NTIsImV4cCI6MjEwNzE3MzU1Mn0.cdJbmQhc_xqCJPOjJcDRJapgG9bIXjj0XbrB6RpYXKI';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var globalPagesData = null;

  async function fetchCatalogFromSupabase() {
    try {
      // Ambil hingga 2000 data sekaligus secara aman
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .range(0, 1999);

      if (error) throw error;

      if (!data || data.length === 0) {
        document.getElementById('catalog-container').innerText = 'Data produk tidak ditemukan di Supabase.';
        return;
      }

      globalPagesData = processSupabaseData(data);
      var initialRegion = document.getElementById('regionSelect').value;
      renderCatalog(initialRegion);
    } catch (err) {
      console.error('Gagal mengambil data:', err);
      document.getElementById('catalog-container').innerText = 'Gagal memuat data dari database. Pastikan RLS / Data API sudah aktif.';
    }
  }

  function processSupabaseData(rawData) {
    var pages = {};

    rawData.forEach(function(row) {
      var pageNum = row['Page'];
      var cardOrder = parseInt(row['Urutan Card']) || 99;
      var sku = row['SKU'];
      var masterCategory = row['Master Kategori'];
      var category = row['Kategori'];
      var subCategory = row['Sub Kategori'];
      var brand = row['Brand'] || '';
      var title = row['Title'] || '';
      var type = row['Type'] || '';
      var size = row['Size'] || '';
      var photo = row['Foto'] || '';
      var uom = row['UOM'] || 'Pcs';

      var prices = {
        'Jabodetabek': { price: formatRp(row['Harga Jabodetabek']), priceOnline: formatRp(row['Harga Online Jabodetabek']) },
        'Jawa':        { price: formatRp(row['Harga Jawa']), priceOnline: formatRp(row['Harga Online Jawa']) },
        'Sumatra':     { price: formatRp(row['Harga Sumatra']), priceOnline: formatRp(row['Harga Online Sumatra']) },
        'Luar Jawa':   { price: formatRp(row['Harga Luar Jawa']), priceOnline: formatRp(row['Harga Online Luar Jawa']) }
      };

      if (!pageNum) return;
      if (!pages[pageNum]) pages[pageNum] = {};

      var productKey = title + '_' + brand;
      if (!pages[pageNum][productKey]) {
        pages[pageNum][productKey] = {
          title: title,
          brand: brand,
          masterCategory: masterCategory,
          category: category,
          subCategory: subCategory,
          photo: photo,
          uom: uom,
          cardOrder: cardOrder,
          items: []
        };
      }

      pages[pageNum][productKey].items.push({
        sku: sku,
        type: type,
        size: size,
        prices: prices
      });
    });

    var structuredPages = {};
    Object.keys(pages).forEach(function(p) {
      var productsArray = Object.keys(pages[p]).map(function(k) { return pages[p][k]; });
      productsArray.sort(function(a, b) { return a.cardOrder - b.cardOrder; });
      structuredPages[p] = productsArray;
    });

    return structuredPages;
  }

  function formatRp(val) {
    if (typeof val === 'number') return 'Rp ' + val.toLocaleString('id-ID');
    if (!val) return 'Rp 0';
    if (typeof val === 'string' && val.startsWith('Rp')) return val;
    return 'Rp ' + val;
  }

  function updateWilayah(selectedRegion) {
    if (globalPagesData) renderCatalog(selectedRegion);
  }

  function renderCatalog(region) {
    var container = document.getElementById('catalog-container');
    container.innerHTML = '';

    var pageKeys = Object.keys(globalPagesData);

    pageKeys.forEach(function(pageNum, index) {
      var productsList = globalPagesData[pageNum];
      
      if (index > 0) {
        var breakDiv = document.createElement('div');
        breakDiv.className = 'html2pdf__page-break';
        container.appendChild(breakDiv);
      }

      var pageDiv = document.createElement('main');
      pageDiv.className = 'page';
      
      var masterCategoryText = (productsList.length > 0) ? productsList[0].masterCategory : 'PERLENGKAPAN KEAMANAN';

      var contentHTML = `
        <div>
          <header class="header">
            <h1>${masterCategoryText}</h1>
            <div class="subtitle">Harga Area ${region} 2026 - Vol.7</div>
          </header>
          <div class="content">`;

      productsList.forEach(function(prod) {
        var rowsHTML = '';
        
        prod.items.forEach(function(item) {
          var priceObj = item.prices[region] || { price: 'Rp 0', priceOnline: 'Rp 0' };
          rowsHTML += `
            <tr>
              <td>${item.sku}</td>
              <td>${item.type}</td>
              <td>${item.size}</td>
              <td class="price-cell">${priceObj.price}</td>
              <td class="online-cell">${priceObj.priceOnline}</td>
            </tr>`;
        });

        var photoHTML = prod.photo 
          ? `<img src="${prod.photo}" alt="Foto Produk" onclick="zoomImage(this.src)">` 
          : '<div style="color:#aaa;font-size:10px;">FOTO PRODUK</div>';

        var brandHTML = prod.brand.startsWith('http') 
          ? `<img src="${prod.brand}" alt="Logo Brand" onclick="zoomImage(this.src)">` 
          : `◈ ${prod.brand}<small>British Standard Tools</small>`;

        contentHTML += `
          <section class="section">
            <aside class="side-label">
              <div class="tag">${prod.subCategory}</div>
              <div class="vertical">${prod.category}</div>
            </aside>
            <div class="product-panel">
              <div class="card-brand">${brandHTML}</div>
              <div class="card-title"><h2>${prod.title}</h2></div>
              <div class="card-photo">${photoHTML}</div>
              <div class="card-table-container">
                <div class="unit-tag">UOM: ${prod.uom}</div>
                <table>
                  <thead>
                    <tr>
                      <th style="width: 28%;">SKU Number</th>
                      <th style="width: 17%;">Type</th>
                      <th style="width: 15%;">Size</th>
                      <th class="price-head" style="width: 20%;">Harga (Rp)</th>
                      <th class="online-head" style="width: 20%;">Harga Online<br>Terendah</th>
                    </tr>
                  </thead>
                  <tbody>${rowsHTML}</tbody>
                </table>
              </div>
            </div>
          </section>`;
      });

      contentHTML += `
          </div>
        </div>
        <footer class="footer">
          <div class="page-number">${pageNum}</div>
          <div class="phone">☎ : (021) 2906 2017 / 2906 2018<br>0812 8703 0377 / 0822 9956 5272</div>
          <div class="fax">▣ : (021) 2906 2019</div>
        </footer>`;

      pageDiv.innerHTML = contentHTML;
      container.appendChild(pageDiv);
    });
  }

  function zoomImage(src) {
    var modal = document.getElementById('imageModal');
    var modalImg = document.getElementById('modalImg');
    modal.style.display = 'flex';
    modalImg.src = src;
  }

  function closeZoom() {
    document.getElementById('imageModal').style.display = 'none';
  }

  function generatePDF() {
    window.scrollTo(0, 0);
    var element = document.getElementById('catalog-container');
    var selectedRegion = document.getElementById('regionSelect').value;
    
    var btn = document.querySelector('.btn-pdf');
    btn.innerText = '⏳ Memproses PDF...';
    btn.disabled = true;

    var opt = {
      margin:       0,
      filename:     'Katalog_Sherlock_' + selectedRegion + '.pdf',
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { 
        scale: 1.5,
        useCORS: true, 
        allowTaint: true,
        logging: false, 
        scrollX: 0, 
        scrollY: 0 
      },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: 'css', before: '.html2pdf__page-break' }
    };

    setTimeout(function() {
      html2pdf().set(opt).from(element).save().then(function() {
        btn.innerText = '📄 Download PDF';
        btn.disabled = false;
      }).catch(function(err) {
        console.error('Error PDF:', err);
        alert('Gagal mendownload PDF.');
        btn.innerText = '📄 Download PDF';
        btn.disabled = false;
      });
    }, 1000);
  }

  // Jalankan Panggilan Data
  fetchCatalogFromSupabase();
</script>
</body>
</html>
