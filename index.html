<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk Sherlock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { 
    box-sizing: border-box; 
  }

  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  body { 
    margin: 0; 
    padding: 10px 0; 
    background: #e9e9e9; 
    font-family: Arial, sans-serif; 
    color: #111; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 20px; 
  }
  
  /* BAR NAVIGASI ATAS MELAYANG (STICKY ON SCROLL) */
  .region-selector-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: #111;
    color: #fff;
    width: 100%;
    max-width: 210mm;
    margin: 0 auto;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  
  .controls-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex: 1;
  }

  .region-selector-bar label { 
    font-size: 13px; 
    font-weight: bold; 
  }
  
  .region-selector-bar select {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #ffc400;
    color: #111;
    cursor: pointer;
  }

  .region-selector-bar select:disabled {
    background: #777;
    color: #fff;
    cursor: not-allowed;
  }

  /* FITUR SEARCH BAR */
  .search-container {
    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 280px;
  }

  .search-input {
    width: 100%;
    padding: 6px 10px;
    font-size: 13px;
    border: none;
    border-radius: 4px;
    outline: none;
  }

  .btn-pdf {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #00a651;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn-pdf:hover { 
    background: #008540; 
  }

  /* TOMBOL KHUSUS SALES & LOGOUT */
  .btn-share-toko {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #007bff;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-share-toko:hover { background: #0056b3; }

  .btn-logout-sales {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #dc3545;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-logout-sales:hover { background: #bd2130; }

  /* DROPDOWN CETAK KATALOG */
  .print-dropdown-container {
    position: relative;
    display: inline-block;
  }

  .print-dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 110%;
    background: #1e1e1e;
    color: #fff;
    min-width: 240px;
    padding: 12px;
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    border: 1px solid #333;
    z-index: 2000;
  }

  .print-dropdown-menu.show {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dropdown-title {
    font-size: 11px;
    font-weight: bold;
    color: #ffc400;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 4px;
    background: #2a2a2a;
    transition: background 0.2s;
  }

  .radio-option:hover {
    background: #3a3a3a;
  }

  .radio-option input[type="radio"] {
    accent-color: #ffc400;
    cursor: pointer;
  }

  .btn-execute-print {
    margin-top: 4px;
    padding: 8px;
    background: #00a651;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-execute-print:hover {
    background: #008540;
  }

  /* TAMPILKAN TOMBOL PDF HANYA DI DESKTOP */
  @media screen and (max-width: 1023px) {
    .desktop-only {
      display: none !important;
    }
  }

  @media screen and (min-width: 1024px) {
    .desktop-only {
      display: flex !important;
    }
  }

  #catalog-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: 60px; /* Jarak agar konten tidak tertutup bar navigasi melayang */
  }

  /* WADAH HALAMAN A4 DESKTOP */
  .page { 
    width: 210mm; 
    max-width: 100%;
    min-height: 290mm;
    height: auto; 
    background: #fff; 
    padding: 8mm 8mm 6mm 8mm; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
    box-sizing: border-box;
  }

  .header { 
    padding-bottom: 6px; 
    border-bottom: 2px solid #111; 
    margin-bottom: 8px; 
  }
  .header h1 { 
    margin: 0; 
    font-size: 22px; 
    font-weight: 800; 
    text-transform: uppercase; 
    letter-spacing: 0.5px;
  }
  .header .subtitle { 
    margin-top: 3px; 
    font-size: 11px; 
    font-style: italic; 
    font-weight: bold; 
    color: #333; 
  }
  
  .content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-around; 
    gap: 12px; 
  }

  .section { 
    display: grid; 
    grid-template-columns: 48px 1fr; 
    gap: 8px; 
    transition: background-color 0.5s ease, transform 0.3s ease;
  }
