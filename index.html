<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk Sherlock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { 
    box-sizing: border-box; 
  }

  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  body { 
    margin: 0; 
    padding: 10px 0; 
    background: #e9e9e9; 
    font-family: Arial, sans-serif; 
    color: #111; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 20px; 
  }
  
  .region-selector-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: #111;
    color: #fff;
    width: 100%;
    max-width: 210mm;
    margin: 0 auto;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  
  .controls-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex: 1;
  }

  .region-selector-bar label { 
    font-size: 13px; 
    font-weight: bold; 
  }
  
  .region-selector-bar select {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #ffc400;
    color: #111;
    cursor: pointer;
  }

  .region-selector-bar select:disabled {
    background: #777;
    color: #fff;
    cursor: not-allowed;
  }

  .search-container {
    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 280px;
  }

  .search-input {
    width: 100%;
    padding: 6px 10px;
    font-size: 13px;
    border: none;
    border-radius: 4px;
    outline: none;
  }

  .btn-pdf {
    padding: 6px 14px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #00a651;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn-pdf:hover { 
    background: #008540; 
  }

  .btn-share-toko {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #007bff;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-share-toko:hover { background: #0056b3; }

  .btn-logout-sales {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
    border: none;
    background: #dc3545;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-logout-sales:hover { background: #bd2130; }

  .print-dropdown-container {
    position: relative;
    display: inline-block;
  }

  .print-dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 110%;
    background: #1e1e1e;
    color: #fff;
    min-width: 240px;
    padding: 12px;
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    border: 1px solid #333;
    z-index: 2000;
  }

  .print-dropdown-menu.show {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dropdown-title {
    font-size: 11px;
    font-weight: bold;
    color: #ffc400;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 4px;
    background: #2a2a2a;
    transition: background 0.2s;
  }

  .radio-option:hover {
    background: #3a3a3a;
  }

  .radio-option input[type="radio"] {
    accent-color: #ffc400;
    cursor: pointer;
  }

  .btn-execute-print {
    margin-top: 4px;
    padding: 8px;
    background: #00a651;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-execute-print:hover {
    background: #008540;
  }

  @media screen and (max-width: 1023px) {
    .desktop-only {
      display: none !important;
    }
  }

  @media screen and (min-width: 1024px) {
    .desktop-only {
      display: flex !important;
    }
  }

  #catalog-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: 60px;
  }

  .page { 
    width: 210mm; 
    max-width: 100%;
    min-height: 290mm;
    height: auto; 
    background: #fff; 
    padding: 8mm 8mm 6mm 8mm; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
    box-sizing: border-box;
  }

  .header { 
    padding-bottom: 6px; 
    border-bottom: 2px solid #111; 
    margin-bottom: 8px; 
  }
  .header h1 { 
    margin: 0; 
    font-size: 22px; 
    font-weight: 800; 
    text-transform: uppercase; 
    letter-spacing: 0.5px;
  }
  .header .subtitle { 
    margin-top: 3px; 
    font-size: 11px; 
    font-style: italic; 
    font-weight: bold; 
    color: #333; 
  }
  
  .content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-around; 
    gap: 12px; 
  }

  .section { 
    display: grid; 
    grid-template-columns: 48px 1fr; 
    gap: 8px; 
    transition: background-color 0.5s ease, transform 0.3s ease;
  }
  
  .highlight-product {
    background-color: #fff8bc !important;
    outline: 3px solid #ffc400;
    border-radius: 4px;
    transform: scale(1.01);
  }

  .side-label { 
    display: flex; 
    flex-direction: column; 
  }

  .side-label .tag { 
    background: #ffc400 !important; 
    color: #111 !important;
    min-height: 38px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-size: 8.5px; 
    font-weight: 800; 
    text-align: center; 
    padding: 2px; 
    text-transform: uppercase; 
    border-radius: 2px 2px 0 0;
  }

  .side-label .vertical { 
    flex: 1; 
    background: #fff3cc !important; 
    color: #111 !important;
    writing-mode: vertical-rl; 
    text-orientation: mixed;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 11px; 
    font-weight: 800; 
    letter-spacing: 1px; 
    text-align: center; 
    text-transform: uppercase; 
    padding: 6px 0;
    border-radius: 0 0 2px 2px;
  }
  
  .product-panel { 
    display: grid; 
    grid-template-columns: 200px 1fr; 
    grid-template-rows: auto 1fr; 
    gap: 8px; 
  }
  
  .card-brand { 
    padding: 4px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    font-size: 14px; 
    font-weight: 800; 
    background: #ffffff !important;
    border-radius: 4px;
  }
  .card-brand img { 
    max-width: 100%; 
    max-height: 45px; 
    object-fit: contain; 
    cursor: pointer;
    background: #ffffff !important;
  }
  .card-brand small { 
    display: block; 
    font-size: 7.5px; 
    font-weight: 700; 
    margin-top: 1px; 
  }
  
  .card-title { 
    padding: 2px 0; 
    display: flex; 
    align-items: center; 
  }
  .card-title h2 { 
    margin: 0; 
    font-size: 17px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  
  .card-photo { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    width: 100%;
    height: 100%;
    padding: 4px; 
    background: #fafafa; 
    overflow: hidden;
  }

  .card-photo img { 
    width: auto; 
    height: auto; 
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
    cursor: pointer;
  }
  
  .card-table-container { 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    position: relative; 
    overflow-x: auto;
  }
  .unit-tag { 
    align-self: flex-end; 
    padding: 1px 4px; 
    font-size: 8.5px; 
    font-weight: 800; 
    background: #fff; 
    margin-bottom: 3px; 
  }
  
  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    font-size: 9.5px; 
  }
  th, td { 
    border: 1px solid #111; 
    padding: 3px 2px; 
    text-align: center; 
    vertical-align: middle; 
  }
  th { 
    background: #a6a6a6 !important; 
    color: #000 !important; 
    font-weight: 800; 
  }
  th.price-head { 
    background: #2522db !important; 
    color: #fff !important; 
  }
  th.online-head { 
    background: #00a651 !important; 
    color: #fff !important; 
  }
  td { font-weight: 700; }
  td.price-cell { 
    color: #2522db !important; 
    text-align: right; 
  }
  td.online-cell { 
    color: #00a651 !important; 
    text-align: right; 
  }
  
  .footer { 
    height: 40px; 
    background: #ffc400 !important; 
    margin-top: 10px; 
    display: grid; 
    grid-template-columns: 40px 1fr 140px; 
    align-items: center; 
    padding: 0 10px; 
    font-size: 9px; 
    font-weight: 700; 
  }
  .page-number { font-size: 24px; }
  .phone { text-align: center; line-height: 1.2; }
  .fax { text-align: right; }

  .image-modal {
    display: none; 
    position: fixed; 
    z-index: 9999; 
    left: 0; top: 0;
    width: 100%; height: 100%; 
    background-color: rgba(0, 0, 0, 0.85); 
    justify-content: center; align-items: center;
    padding: 20px;
  }
  .image-modal-content {
    max-width: 90%; max-height: 85vh;
    object-fit: contain; border-radius: 6px;
    background: #fff; padding: 10px;
  }
  .close-modal {
    position: absolute; top: 15px; right: 25px;
    color: #fff; font-size: 35px; font-weight: bold; cursor: pointer;
  }

  @media screen and (max-width: 768px) {
    body { padding: 0; }
    
    .region-selector-bar { 
      max-width: 100%; 
      flex-direction: column; 
      align-items: stretch;
      gap: 8px; 
      padding: 8px 10px;
    }

    .controls-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .region-selector-bar label { display: none; }

    .search-container { flex: 1; max-width: 100%; }
    .search-input { font-size: 12px; padding: 6px 8px; }

    #catalog-container {
      margin-top: 90px;
    }

    .page { 
      width: 100vw; 
      min-height: auto; 
      padding: 10px 8px; 
      box-shadow: none; 
      border-bottom: 6px solid #e9e9e9;
    }

    .header h1 { font-size: 15px; }
    .header .subtitle { font-size: 10px; }

    .section { grid-template-columns: 28px 1fr; gap: 6px; }
    .side-label .tag { font-size: 7px; min-height: 28px; padding: 1px; }
    .side-label .vertical { font-size: 8.5px; letter-spacing: 0.5px; }

    .product-panel { grid-template-columns: 1fr; grid-template-rows: auto; gap: 6px; }
    .card-brand { padding: 2px; }
    .card-brand img { max-height: 35px; }
    .card-title h2 { font-size: 13px; }
    .card-photo { min-height: 100px; padding: 2px; }
    .card-photo img { max-height: 95px; }

    .card-table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; table-layout: auto; font-size: 8px; }
    th, td { padding: 4px 2px; word-break: break-word; }
    th { font-size: 7.5px; }
    td.price-cell, td.online-cell { font-size: 8px; white-space: nowrap; }

    .footer { font-size: 7.5px; grid-template-columns: 25px 1fr 90px; padding: 0 5px; }
    .page-number { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="region-selector-bar">
  <div class="controls-group">
    <label for="regionSelect">📍 Wilayah:</label>
    <select id="regionSelect" onchange="updateWilayah(this.value)">
      <option value="Jabodetabek" selected>Jabodetabek</option>
      <option value="Jawa">Jawa</option>
      <option value="Sumatra">Sumatra</option>
      <option value="Luar Jawa">Luar Jawa</option>
    </select>

    <div class="search-container">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="🔍 Cari SKU / Judul Produk..." 
        list="productsDatalist"
        onchange="searchProduct(this.value)"
        onkeyup="handleSearchKey(event)"
      >
      <datalist id="productsDatalist"></datalist>
    </div>

    <button id="btnShareToko" class="btn-share-toko" onclick="handleShareToToko()" style="display:none;">🔗 Bagikan ke Toko</button>
    <button id="btnLogoutSales" class="btn-logout-sales" onclick="handleLogout()" style="display:none;">🚪 Logout</button>
  </div>

  <div class="print-dropdown-container desktop-only">
    <button class="btn-pdf" onclick="togglePrintMenu(event)">🖨️ Cetak Katalog ▾</button>
    
    <div id="printMenu" class="print-dropdown-menu">
      <div class="dropdown-title">Pilih Mode Cetak:</div>
      <label class="radio-option">
        <input type="radio" name="printMode" value="full" checked>
        <span>Cetak Full (Lengkap)</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="printMode" value="no-online">
        <span>Tanpa Harga Online Terendah</span>
      </label>
      <button class="btn-execute-print" onclick="executePrint()">Buka Halaman Cetak 🚀</button>
    </div>
  </div>
</div>

<div id="catalog-container">Memuat data dari Supabase...</div>

<div id="imageModal" class="image-modal" onclick="closeZoom()">
  <span class="close-modal" onclick="closeZoom()">&times;</span>
  <img class="image-modal-content" id="modalImg" alt="Zoom Foto">
</div>

<script>
  const SUP
