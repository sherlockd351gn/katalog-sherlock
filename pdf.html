<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Katalog Produk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    padding: 20px 0; 
    background: #525659; 
    font-family: Arial, sans-serif; 
    color: #111; 
  }

  .floating-print-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    background: #00a651;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, background 0.2s;
  }
  .floating-print-btn:hover {
    background: #008540;
    transform: scale(1.05);
  }

  #pdf-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .page { 
    width: 210mm; 
    min-height: 295mm; 
    height: auto;
    background: #fff; 
    padding: 8mm 8mm 6mm 8mm; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    box-sizing: border-box;
    page-break-after: always;
    break-after: page;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .header { 
    padding-bottom: 6px; 
    border-bottom: 2px solid #111; 
    margin-bottom: 8px; 
  }
  .header h1 { 
    margin: 0; 
    font-size: 22px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  .header .subtitle { 
    margin-top: 3px; 
    font-size: 11px; 
    font-style: italic; 
    font-weight: bold; 
    color: #333; 
  }
  
  .content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-around; 
    gap: 6px; 
  }

  .section { 
    display: grid; 
    grid-template-columns: 48px 1fr; 
    gap: 8px; 
  }
  
  .side-label { 
    display: flex; 
    flex-direction: column; 
  }

  .side-label .tag { 
    background: #ffc400 !important; 
    color: #111 !important;
    min-height: 38px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-size: 8.5px; 
    font-weight: 800; 
    text-align: center; 
    padding: 2px; 
    text-transform: uppercase; 
    border-radius: 2px 2px 0 0;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .side-label .vertical { 
    flex: 1; 
    background: #fff3cc !important; 
    color: #111 !important;
    writing-mode: vertical-rl; 
    text-orientation: mixed;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 11px; 
    font-weight: 800; 
    letter-spacing: 1px; 
    text-align: center; 
    text-transform: uppercase; 
    padding: 6px 0;
    border-radius: 0 0 2px 2px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  .product-panel { 
    display: grid; 
    grid-template-columns: 170px 1fr; 
    grid-template-rows: auto 1fr; 
    gap: 8px; 
  }
  
  .card-brand { 
    padding: 4px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    font-size: 14px; 
    font-weight: 800; 
    background: #ffffff !important;
    border-radius: 4px;
  }
  .card-brand img { 
    max-width: 100%; 
    max-height: 45px; 
    object-fit: contain; 
    background: #ffffff !important;
  }
  .card-brand small { 
    display: block; 
    font-size: 7.5px; 
    font-weight: 700; 
    margin-top: 1px; 
  }
  
  .card-title { 
    padding: 2px 0; 
    display: flex; 
    align-items: center; 
  }
  .card-title h2 { 
    margin: 0; 
    font-size: 17px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  
  .card-photo { 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  height: 100%; /* Ubah min-height kaku jadi 100% tinggi kontainer */
  padding: 6px; 
  background: #fafafa; 
}

.card-photo img { 
  max-width: 100%; 
  max-height: 250px; /* Perbesar batas tinggi maksimum gambar agar lebih jelas */
  object-fit: contain; 
}
  
  .card-table-container { 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    position: relative; 
  }
  .unit-tag { 
    align-self: flex-end; 
    padding: 1px 4px; 
    font-size: 8.5px; 
    font-weight: 800; 
    background: #fff; 
    margin-bottom: 3px; 
  }
  
  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    font-size: 9.5px; 
  }
th, td { 
  border: 1px solid #111; 
  padding: 3px 2px; /* Padatkan padding vertikal sedikit agar baris panjang tidak kelewat batas halaman */
  text-align: center; 
  vertical-align: middle; 
}
  th { 
    background: #a6a6a6 !important; 
    color: #000 !important; 
    font-weight: 800; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  th.price-head { 
    background: #2522db !important; 
    color: #fff !important; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  th.online-head { 
    background: #00a651 !important; 
    color: #fff !important; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  td { font-weight: 700; }
  td.price-cell { 
    color: #2522db !important; 
    text-align: right; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  td.online-cell { 
    color: #00a651 !important; 
    text-align: right; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  .footer { 
    height: 40px; 
    background: #ffc400 !important; 
    margin-top: 4px; 
    display: grid; 
    grid-template-columns: 40px 1fr 140px; 
    align-items: center; 
    padding: 0 10px; 
    font-size: 9px; 
    font-weight: 700; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .page-number { font-size: 24px; }
  .phone { text-align: center; line-height: 1.2; }
  .fax { text-align: right; }

  @media print {
    .floating-print-btn {
      display: none !important;
    }
    @page {
      size: A4 portrait;
      margin: 0;
    }
    body {
      background: #fff;
      padding: 0;
    }
    .page {
      box-shadow: none;
      margin: 0;
      width: 100%;
      height: 100vh;
    }
  }
</style>
</head>
<body>

<button class="floating-print-btn" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>

<div id="pdf-container"></div>

<script>
  const SUPABASE_URL = 'https://yarudntqrnwljykieugl.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcnVkbnRxcm53bGp5a2lldWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTc1NTIsImV4cCI6MjEwNzE3MzU1Mn0.cdJbmQhc_xqCJPOjJcDRJapgG9bIXjj0XbrB6RpYXKI';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const urlParams = new URLSearchParams(window.location.search);
  const selectedRegion = urlParams.get('region') || 'Jabodetabek';
  const printMode = urlParams.get('mode') || 'full'; // 'full' ATAU 'no-online'

  async function startPdfProcess() {
    try {
      let allData = [];
      let from = 0;
      const step = 1000;
      let keepFetching = true;

      while (keepFetching) {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .range(from, from + step - 1);

        if (error) throw error;

        if (data && data.length > 0) {
          allData = allData.concat(data);
          if (data.length < step) {
            keepFetching = false;
          } else {
            from += step;
          }
        } else {
          keepFetching = false;
        }
      }

      const processedPages = processSupabaseData(allData);
      renderPdfHTML(processedPages, selectedRegion, printMode);

    } catch (err) {
      console.error(err);
      alert('Gagal memproses data: ' + err.message);
    }
  }

  function processSupabaseData(rawData) {
    var pages = {};
    rawData.forEach(function(row) {
      var rawPage = row['Page'];
      if (rawPage === null || rawPage === undefined || String(rawPage).trim() === '') return;
      var pageNum = String(rawPage).trim();

      var cardOrder = parseInt(row['Urutan Card']) || 99;
      var sku = row['SKU'] || '';
      var masterCategory = row['Master Kategori'] || '';
      var category = row['Kategori'] || '';
      var subCategory = row['Sub Kategori'] || '';
      var brand = row['Brand'] || '';
      var title = row['Title'] || '';
      var type = row['Type'] || '';
      var size = row['Size'] || '';
      var photo = row['Foto'] || '';
      var uom = row['UOM'] || 'Pcs';

      var prices = {
        'Jabodetabek': { price: formatRp(row['Harga Jabodetabek']), priceOnline: formatRp(row['Harga Online Jabodetabek']) },
        'Jawa':        { price: formatRp(row['Harga Jawa']), priceOnline: formatRp(row['Harga Online Jawa']) },
        'Sumatra':     { price: formatRp(row['Harga Sumatra']), priceOnline: formatRp(row['Harga Online Sumatra']) },
        'Luar Jawa':   { price: formatRp(row['Harga Luar Jawa']), priceOnline: formatRp(row['Harga Online Luar Jawa']) }
      };

      if (!pages[pageNum]) pages[pageNum] = {};

      var productKey = pageNum + '_' + cardOrder + '_' + subCategory + '_' + title + '_' + brand;
      if (!pages[pageNum][productKey]) {
        pages[pageNum][productKey] = {
          title: title, brand: brand, masterCategory: masterCategory,
          category: category, subCategory: subCategory, photo: photo,
          uom: uom, cardOrder: cardOrder, items: []
        };
      }

      pages[pageNum][productKey].items.push({ sku: sku, type: type, size: size, prices: prices });
    });

    var structuredPages = {};
    var sortedPageKeys = Object.keys(pages).sort(function(a, b) {
      var numA = parseInt(a.replace(/\D/g, '')) || 0;
      var numB = parseInt(b.replace(/\D/g, '')) || 0;
      return numA - numB;
    });

    sortedPageKeys.forEach(function(p) {
      var productsArray = Object.keys(pages[p]).map(function(k) { return pages[p][k]; });
      productsArray.sort(function(a, b) { return a.cardOrder - b.cardOrder; });
      structuredPages[p] = productsArray;
    });

    return structuredPages;
  }

  function formatRp(val) {
    if (typeof val === 'number') return 'Rp ' + val.toLocaleString('id-ID');
    if (!val) return 'Rp 0';
    if (typeof val === 'string' && val.startsWith('Rp')) return val;
    return 'Rp ' + val;
  }

  function renderPdfHTML(pagesData, region, mode) {
    var container = document.getElementById('pdf-container');
    container.innerHTML = '';
    var pageKeys = Object.keys(pagesData);

    var hideOnline = (mode === 'no-online');

    pageKeys.forEach(function(pageNum) {
      var productsList = pagesData[pageNum];

      var pageDiv = document.createElement('main');
      pageDiv.className = 'page';
      var masterCategoryText = (productsList.length > 0 && productsList[0].masterCategory) 
        ? productsList[0].masterCategory 
        : 'PERLENGKAPAN KEAMANAN';

      var contentHTML = `
        <div>
          <header class="header">
            <h1>${masterCategoryText}</h1>
            <div class="subtitle">Harga Area ${region} 2026</div>
          </header>
          <div class="content">`;

      productsList.forEach(function(prod) {
        var rowsHTML = '';
        prod.items.forEach(function(item) {
          var priceObj = item.prices[region] || { price: 'Rp 0', priceOnline: 'Rp 0' };
          
          rowsHTML += `
            <tr>
              <td>${item.sku}</td>
              <td>${item.type}</td>
              <td>${item.size}</td>
              <td class="price-cell">${priceObj.price}</td>
              ${hideOnline ? '' : `<td class="online-cell">${priceObj.priceOnline}</td>`}
            </tr>`;
        });

        var photoHTML = (prod.photo && typeof prod.photo === 'string' && prod.photo.startsWith('http'))
          ? `<img src="${prod.photo}" alt="Foto">` 
          : '<div style="color:#aaa;font-size:10px;font-weight:bold;">FOTO PRODUK</div>';

        var brandHTML = (prod.brand && typeof prod.brand === 'string' && prod.brand.startsWith('http'))
          ? `<img src="${prod.brand}" alt="Brand">` 
          : `◈ ${prod.brand || 'SHERLOCK'}<small>British Standard Tools</small>`;

        // Konfigurasi Lebar Kolom Tabel Berdasarkan Mode Cetak
        var tableHeadHTML = hideOnline ? `
          <thead>
            <tr>
              <th style="width: 35%;">SKU Number</th>
              <th style="width: 25%;">Type</th>
              <th style="width: 15%;">Size</th>
              <th class="price-head" style="width: 25%;">Harga (Rp)</th>
            </tr>
          </thead>
        ` : `
          <thead>
            <tr>
              <th style="width: 28%;">SKU Number</th>
              <th style="width: 17%;">Type</th>
              <th style="width: 15%;">Size</th>
              <th class="price-head" style="width: 20%;">Harga (Rp)</th>
              <th class="online-head" style="width: 20%;">Harga Online<br>Terendah</th>
            </tr>
          </thead>
        `;

        contentHTML += `
          <section class="section">
            <aside class="side-label">
              <div class="tag">${prod.subCategory}</div>
              <div class="vertical">${prod.category}</div>
            </aside>
            <div class="product-panel">
              <div class="card-brand">${brandHTML}</div>
              <div class="card-title"><h2>${prod.title}</h2></div>
              <div class="card-photo">${photoHTML}</div>
              <div class="card-table-container">
                <div class="unit-tag">UOM: ${prod.uom}</div>
                <table>
                  ${tableHeadHTML}
                  <tbody>${rowsHTML}</tbody>
                </table>
              </div>
            </div>
          </section>`;
      });

      contentHTML += `
          </div>
        </div>
        <footer class="footer">
          <div class="page-number">${pageNum}</div>
          <div class="phone">☎ : (021) 2906 2017 / 2906 2018<br>0812 8703 0377 / 0822 9956 5272</div>
          <div class="fax">▣ : (021) 2906 2019</div>
        </footer>`;

      pageDiv.innerHTML = contentHTML;
      container.appendChild(pageDiv);
    });
  }

  startPdfProcess();
</script>
</body>
</html>
