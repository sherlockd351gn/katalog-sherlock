<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Katalog Produk</title>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    padding: 20px 0; 
    background: #525659; 
    font-family: Arial, sans-serif; 
    color: #111; 
  }

  /* Tombol Cetak Melayang di Kanan Atas */
  .floating-print-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    background: #00a651;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, background 0.2s;
  }
  .floating-print-btn:hover {
    background: #008540;
    transform: scale(1.05);
  }

  #pdf-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .page { 
    width: 210mm; 
    height: 295mm; 
    background: #fff; 
    padding: 8mm 8mm 6mm 8mm; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    box-sizing: border-box;
    page-break-after: always;
    break-after: page;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .header { 
    padding-bottom: 6px; 
    border-bottom: 2px solid #111; 
    margin-bottom: 8px; 
  }
  .header h1 { 
    margin: 0; 
    font-size: 22px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  .header .subtitle { 
    margin-top: 3px; 
    font-size: 11px; 
    font-style: italic; 
    font-weight: bold; 
    color: #333; 
  }
  
  .content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-around; 
    gap: 6px; 
  }

  .section { 
    display: grid; 
    grid-template-columns: 48px 1fr; 
    gap: 8px; 
  }
  
  .side-label { 
    display: flex; 
    flex-direction: column; 
  }

  .side-label .tag { 
    background: #ffc400 !important; 
    color: #111 !important;
    min-height: 38px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-size: 8.5px; 
    font-weight: 800; 
    text-align: center; 
    padding: 2px; 
    text-transform: uppercase; 
    border-radius: 2px 2px 0 0;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .side-label .vertical { 
    flex: 1; 
    background: #fff3cc !important; 
    color: #111 !important;
    writing-mode: vertical-rl; 
    text-orientation: mixed;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 11px; 
    font-weight: 800; 
    letter-spacing: 1px; 
    text-align: center; 
    text-transform: uppercase; 
    padding: 6px 0;
    border-radius: 0 0 2px 2px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  .product-panel { 
    display: grid; 
    grid-template-columns: 170px 1fr; 
    grid-template-rows: auto 1fr; 
    gap: 8px; 
  }
  
  .card-brand { 
    padding: 4px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    font-size: 14px; 
    font-weight: 800; 
    background: #fff;
  }
  .card-brand img { 
    max-width: 100%; 
    max-height: 45px; 
    object-fit: contain; 
  }
  .card-brand small { 
    display: block; 
    font-size: 7.5px; 
    font-weight: 700; 
    margin-top: 1px; 
  }
  
  .card-title { 
    padding: 2px 0; 
    display: flex; 
    align-items: center; 
  }
  .card-title h2 { 
    margin: 0; 
    font-size: 17px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }
  
  .card-photo { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 155px; 
    padding: 4px; 
    background: #fafafa; 
  }
  .card-photo img { 
    max-width: 100%; 
    max-height: 150px; 
    object-fit: contain; 
  }
  
  .card-table-container { 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    position: relative; 
  }
  .unit-tag { 
    align-self: flex-end; 
    padding: 1px 4px; 
    font-size: 8.5px; 
    font-weight: 800; 
    background: #fff; 
    margin-bottom: 3px; 
  }
  
  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    font-size: 9.5px; 
  }
  th, td { 
    border: 1px solid #111; 
    padding: 5px 4px; 
    text-align: center; 
    vertical-align: middle; 
  }
  th { 
    background: #a6a6a6 !important; 
    color: #000 !important; 
    font-weight: 800; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  th.price-head { 
    background: #2522db !important; 
    color: #fff !important; 
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
