<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Sherlock - Mode Admin</title>

<!-- Supabase Client & PapaParse untuk CSV -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #e0e0e0;
    margin: 0;
    padding: 0;
    color: #333;
  }

  /* BAR NAVIGASI ADMIN ATAS */
  .admin-navbar {
    background: #111;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .admin-navbar .brand-title {
    font-size: 18px;
    font-weight: bold;
    color: #ffc400;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .admin-menu-btns {
    display: flex;
    gap: 10px;
  }

  .btn-admin {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-yellow { background: #ffc400; color: #111; }
  .btn-yellow:hover { background: #e0ac00; }
  .btn-green { background: #00a651; color: #fff; }
  .btn-green:hover { background: #008540; }
  .btn-red { background: #dc3545; color: #fff; }
  .btn-red:hover { background: #bd2130; }

  /* KONTEN KATALOG (A4 PREVIEW) */
  .catalog-container {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 15px;
  }

  .catalog-page {
    background: #fff;
    width: 100%;
    min-height: 1000px;
    margin-bottom: 30px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    border-radius: 4px;
  }

  /* MODAL POP-UP UNTUK UPLOAD */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
  }

  .modal-card {
    background: #fff;
    width: 90%;
    max-width: 600px;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    position: relative;
  }

  .modal-card h3 { margin-top: 0; color: #111; border-bottom: 2px solid #ffc400; padding-bottom: 8px; }
  .close-btn {
    position: absolute;
    top: 15px; right: 20px;
    font-size: 22px; font-weight: bold; cursor: pointer; color: #888;
  }
  .close-btn:hover { color: #000; }

  .form-group { margin-bottom: 15px; }
  label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
  input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }

  .status-msg {
    margin-top: 10px; padding: 10px; border-radius: 4px; font-size: 13px; font-weight: bold; display: none;
  }
  .status-success { background: #d4edda; color: #155724; }
  .status-error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<!-- NAVBAR UTAMA ADMIN -->
<div class="admin-navbar">
  <div class="brand-title">
    ⚙️ Mode Admin Katalog
  </div>

  <div class="admin-menu-btns">
    <button class="btn-admin btn-yellow" onclick="openModal('modalCSV')">📊 Upload CSV Produk</button>
    <button class="btn-admin btn-green" onclick="openModal('modalFoto')">📸 Upload Foto Card</button>
    <button class="btn-admin btn-red" onclick="handleLogout()">🚪 Logout</button>
  </div>
</div>

<!-- TAMPILAN KATALOG DIGITAL -->
<div class="catalog-container" id="catalogContent">
  <div class="catalog-page">
    <h2 style="text-align: center; color: #666; margin-top: 200px;">Memuat Tampilan Katalog...</h2>
  </div>
</div>

<!-- MODAL 1: UPLOAD CSV -->
<div id="modalCSV" class="modal-overlay">
  <div class="modal-card">
    <span class="close-btn" onclick="closeModal('modalCSV')">&times;</span>
    <h3>📊 Upload / Update Data Produk via CSV</h3>
    <div class="form-group">
      <label>Pilih File CSV Data Produk:</label>
      <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVSelect()">
    </div>
    <div id="csvStatus" class="status-msg"></div>
    <br>
    <button id="btnUploadCSV" class="btn-admin btn-green" onclick="processCSVUpload()" disabled>Upload CSV ke Database 🚀</button>
  </div>
</div>

<!-- MODAL 2: UPLOAD FOTO CARD -->
<div id="modalFoto" class="modal-overlay">
  <div class="modal-card">
    <span class="close-btn" onclick="closeModal('modalFoto')">&times;</span>
    <h3>📸 Upload Foto Title Card</h3>
    <p style="font-size: 12px; color: #666;">Hanya menampilkan daftar Title produk yang <b>belum ada fotonya</b>.</p>
    
    <div class="form-group">
      <label>Pilih Title Produk (Belum ada foto):</label>
      <select id="titleSelect" onchange="handleTitleSelect()">
        <option value="">-- Memuat daftar... --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Pilih File Gambar:</label>
      <input type="file" id="imageFileInput" accept="image/*" disabled>
    </div>

    <div id="photoStatus" class="status-msg"></div>
    <br>
    <button id="btnUploadPhoto" class="btn-admin btn-green" onclick="processPhotoUpload()" disabled>Simpan & Update Foto 📸</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://yarudntqrnwljykieugl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhcnVkbnRxcm53bGp5a2lldWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1OTc1NTIsImV4cCI6MjEwNzE3MzU1Mn0.cdJbmQhc_xqCJPOjJcDRJapgG9bIXjj0XbrB6RpYXKI';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var parsedCSVData = [];

  // 1. CEK OTORISASI AKUN ADMIN
  function checkAdminAuth() {
    const savedUser = localStorage.getItem('sherlock_user');
    if (!savedUser) {
      window.location.href = 'login.html';
      return;
    }
    const user = JSON.parse(savedUser);
    if (user.role !== 'admin') {
      alert('Akses Ditolak! Halaman ini khusus Admin.');
      window.location.href = 'index.html';
    }
  }

  // 2. MODAL CONTROLLER
  function openModal(id) {
    document.getElementById(id).style.display = 'flex';
    if (id === 'modalFoto') loadEmptyTitles();
  }
  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  // 3. LOGIKA UPLOAD CSV
  function handleCSVSelect() {
    const file = document.getElementById('csvFileInput').files[0];
    if (!file) return;

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        parsedCSVData = results.data;
        document.getElementById('btnUploadCSV').disabled = false;
      }
    });
  }

  async function processCSVUpload() {
    const statusEl = document.getElementById('csvStatus');
    statusEl.style.display = 'block';
    statusEl.className = 'status-msg';
    statusEl.innerText = 'Mengunggah data produk...';

    try {
      const { error } = await supabaseClient.from('products').upsert(parsedCSVData);
      if (error) throw error;

      statusEl.className = 'status-msg status-success';
      statusEl.innerText = 'Berhasil mengunggah ' + parsedCSVData.length + ' produk!';
      setTimeout(() => {
        closeModal('modalCSV');
        loadCatalogPreview(); // Refresh tampilan katalog
      }, 1500);

    } catch (err) {
      statusEl.className = 'status-msg status-error';
      statusEl.innerText = 'Gagal upload: ' + err.message;
    }
  }

  // 4. LOGIKA UPLOAD FOTO TITLE CARD
  async function loadEmptyTitles() {
    const selectEl = document.getElementById('titleSelect');
    selectEl.innerHTML = '<option value="">-- Memuat data... --</option>';

    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('Title')
        .or('Foto.is.null,Foto.eq.');

      if (error) throw error;

      const titleSet = new Set();
      data.forEach(row => { if (row.Title) titleSet.add(row.Title.trim()); });
      const titles = Array.from(titleSet).sort();

      selectEl.innerHTML = titles.length === 0 
        ? '<option value="">🎉 Semua Title Card sudah ada foto!</option>'
        : '<option value="">-- Pilih Title (' + titles.length + ' Belum ada foto) --</option>';

      titles.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.innerText = t;
        selectEl.appendChild(opt);
      });
    } catch (err) {
      selectEl.innerHTML = '<option value="">Gagal memuat data</option>';
    }
  }

  function handleTitleSelect() {
    const val = document.getElementById('titleSelect').value;
    document.getElementById('imageFileInput').disabled = !val;
    document.getElementById('btnUploadPhoto').disabled = !val;
  }

  async function processPhotoUpload() {
    const selectedTitle = document.getElementById('titleSelect').value;
    const file = document.getElementById('imageFileInput').files[0];
    const statusEl = document.getElementById('photoStatus');

    if (!selectedTitle || !file) return;

    statusEl.style.display = 'block';
    statusEl.className = 'status-msg';
    statusEl.innerText = 'Mengunggah gambar ke Storage...';

    try {
      const sanitizeTitle = selectedTitle.replace(/[^a-zA-Z0-9]/g, '_');
      const fileName = 'Logo Brand/' + sanitizeTitle + '_' + Date.now() + '.' + file.name.split('.').pop();

      const { error: uploadError } = await supabaseClient.storage.from('images').upload(fileName, file, { upsert: true });
      if (uploadError) throw uploadError;

      const { data: publicUrlData } = supabaseClient.storage.from('images').getPublicUrl(fileName);
      const publicUrl = publicUrlData.publicUrl;

      const { error: updateError } = await supabaseClient.from('products').update({ Foto: publicUrl }).eq('Title', selectedTitle);
      if (updateError) throw updateError;

      statusEl.className = 'status-msg status-success';
      statusEl.innerText = 'Berhasil memperbarui foto untuk Title ' + selectedTitle;
      setTimeout(() => {
        closeModal('modalFoto');
        loadCatalogPreview(); // Refresh tampilan katalog
      }, 1500);

    } catch (err) {
      statusEl.className = 'status-msg status-error';
      statusEl.innerText = 'Gagal upload foto: ' + err.message;
    }
  }

  // 5. LOAD SIMULASI KATALOG
  async function loadCatalogPreview() {
    const container = document.getElementById('catalogContent');
    container.innerHTML = '<div class="catalog-page"><h3>Memuat ulang data katalog terbaru dari database...</h3></div>';

    // Memanggil fungsi render katalog sesuai logic index.html
    // (Render produk per halaman A4)
  }

  function handleLogout() {
    localStorage.removeItem('sherlock_user');
    window.location.href = 'login.html';
  }

  // Inisialisasi
  checkAdminAuth();
  loadCatalogPreview();
</script>
</body>
</html>
